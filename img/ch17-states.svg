<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="900" height="430" fill="#181818"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0c0c0"/></marker></defs>
  <text x="20" y="24" fill="#ffffff" font-size="13">An enemy's life: the flag byte and the movement state, as the type-0 driver (0:$8A17) runs them every frame</text>
  <g stroke="#c0c0c0" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <path d="M170,110 L230,110"/>
    <path d="M390,110 L450,110"/>
    <path d="M530,130 L530,180"/>
    <path d="M450,200 L390,200"/>
    <path d="M310,220 L310,260" />
    <path d="M230,200 L170,200"/>
    <path d="M110,220 L110,260"/>
    <path d="M610,200 L670,200"/>
    <path d="M610,300 L670,300"/>
    <path d="M530,320 L530,360"/>
    <path d="M750,220 L750,280"/>
    <path d="M670,310 L610,310" stroke-dasharray="4,3"/>
    <path d="M390,300 L450,300"/>
  </g>
  <g fill="#e0e0e0" font-size="11" text-anchor="middle">
    <rect x="30" y="90" width="140" height="40" rx="6" fill="#2c2c2c" stroke="#808080"/><text x="100" y="108">spawned on the</text><text x="100" y="122">record's schedule</text>
    <rect x="230" y="90" width="160" height="40" rx="6" fill="#3a3a5a" stroke="#8080c0"/><text x="310" y="108">entrance: drops from</text><text x="310" y="122">the top to its line</text>
    <rect x="450" y="90" width="160" height="40" rx="6" fill="#3a5a3a" stroke="#80c080"/><text x="530" y="108">loose: the movement</text><text x="530" y="122">states below</text>
    <rect x="450" y="180" width="160" height="40" rx="6" fill="#3a5a3a" stroke="#80c080"/><text x="530" y="198">1 / 3 walking right / left</text><text x="530" y="212">2 falling, 4 / 5 jumping</text>
    <rect x="230" y="180" width="160" height="40" rx="6" fill="#5a5a3a" stroke="#c0c080"/><text x="310" y="198">in a bubble ($80)</text><text x="310" y="212">the bubble task owns it</text>
    <rect x="30" y="180" width="140" height="40" rx="6" fill="#5a3a3a" stroke="#c08080"/><text x="100" y="198">popped: dead ($40)</text><text x="100" y="212">1000 points</text>
    <rect x="30" y="260" width="160" height="40" rx="6" fill="#5a3a3a" stroke="#c08080"/><text x="110" y="278">tumble script, fall,</text><text x="110" y="292">land as fruit, collected</text>
    <rect x="230" y="260" width="160" height="40" rx="6" fill="#5a5a3a" stroke="#c0c080"/><text x="310" y="278">escaped ($20): angry,</text><text x="310" y="292">speed + 6, back to loose</text>
    <rect x="670" y="180" width="160" height="40" rx="6" fill="#5a3a5a" stroke="#c080c0"/><text x="750" y="198">caught by an item or a</text><text x="750" y="212">special bubble ($10)</text>
    <rect x="670" y="280" width="160" height="40" rx="6" fill="#5a3a3a" stroke="#c08080"/><text x="750" y="298">killed: dies where it</text><text x="750" y="312">stands, 3000 with a killer</text>
    <rect x="450" y="280" width="160" height="40" rx="6" fill="#2c2c2c" stroke="#808080"/><text x="530" y="298">angry (flag bit 7): speed</text><text x="530" y="312">+ 6, hurried: falls through floors</text>
    <rect x="450" y="360" width="160" height="40" rx="6" fill="#2c2c2c" stroke="#808080"/><text x="530" y="378">gone (flag bit 3):</text><text x="530" y="392">the slot is freed</text>
  </g>
  <g fill="#a0a0a0" font-size="10" text-anchor="middle">
    <text x="200" y="104">180 fr</text>
    <text x="420" y="104">arrived</text>
    <text x="420" y="172">bubble in flight, within 14 px</text>
    <text x="200" y="172">a player pops it</text>
    <text x="640" y="172">within 15 px</text>
    <text x="420" y="332">HURRY UP,</text>
    <text x="420" y="344">or the last enemy</text>
    <text x="640" y="272">by an item or bubble</text>
  </g>
  <g fill="#a0a0a0" font-size="10">
    <text x="318" y="245">bubble timer out</text>
    <text x="538" y="345">fruit collected or timed out</text>
  </g>
</svg>
