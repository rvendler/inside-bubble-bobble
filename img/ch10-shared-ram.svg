<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="900" height="560" fill="#181818"/>
  <text x="20" y="24" fill="#ffffff" font-size="13">The MCU's shared RAM: main CPU $FC00-$FFFF = MCU $0C00-$0FFF (1 KB). Who writes each region, and whether the game reads it.</text>
  <g font-size="11">
    <!-- header -->
    <text x="20" y="50" fill="#c0c0c0">main address</text><text x="150" y="50" fill="#c0c0c0">MCU</text><text x="205" y="50" fill="#c0c0c0">contents</text><text x="655" y="50" fill="#c0c0c0">written by</text><text x="775" y="50" fill="#c0c0c0">read by the game</text>
    <line x1="20" y1="56" x2="880" y2="56" stroke="#606060"/>
  </g>
  <g font-size="11" fill="#e0e0e0">
    <rect x="20" y="62" width="860" height="18" fill="#3a3a5a"/><text x="24" y="75">$FC00</text><text x="150" y="75">$0C00</text><text x="205" y="75">interrupt vector low byte, $2E (the MCU pulses; the CPU fetches $0B2E)</text><text x="655" y="75">main, at boot</text><text x="775" y="75">the interrupt</text>
    <rect x="20" y="82" width="860" height="18" fill="#5a3a3a"/><text x="24" y="95">$FC01-$FC1C</text><text x="150" y="95">$0C01</text><text x="205" y="95">7 enemy records x 4: [flags, x, y, -]; bit 0 of flags = compute me</text><text x="655" y="95">main, task 4</text><text x="775" y="95">MCU</text>
    <rect x="20" y="102" width="860" height="18" fill="#2c2c2c"/><text x="24" y="115">$FC1E</text><text x="150" y="115">$0C1E</text><text x="205" y="115">credits, the MCU's copy</text><text x="655" y="115">both</text><text x="775" y="115">never</text>
    <rect x="20" y="122" width="860" height="18" fill="#3a5a3a"/><text x="24" y="135">$FC1F-$FC23</text><text x="150" y="135">$0C1F</text><text x="205" y="135">port 1 (coins, service), DIP A, DIP B, IN1 (P1 stick, buttons), IN2 (P2, start)</text><text x="655" y="135">MCU, every frame</text><text x="775" y="135">yes: the only inputs</text>
    <rect x="20" y="142" width="860" height="18" fill="#2c2c2c"/><text x="24" y="155">$FC24-$FC26</text><text x="150" y="155">$0C24</text><text x="205" y="155">lives P1, lives P2, a round-like value: kept on command (see $FC6F)</text><text x="655" y="155">MCU</text><text x="775" y="155">never commanded</text>
    <rect x="20" y="162" width="860" height="18" fill="#5a3a5a"/><text x="24" y="175">$FC27-$FC5E</text><text x="150" y="175">$0C27</text><text x="205" y="175">7 results x 8: [dir x P1, P2; dir y P1, P2; |dx| P1, P2; |dy| P1, P2]</text><text x="655" y="175">MCU, every frame</text><text x="775" y="175">yes: enemy AI</text>
    <rect x="20" y="182" width="860" height="18" fill="#5a3a3a"/><text x="24" y="195">$FC5F-$FC61</text><text x="150" y="195">$0C5F</text><text x="205" y="195">P1 active flag, P1 x, P1 y</text><text x="655" y="195">main, task 3</text><text x="775" y="195">MCU</text>
    <rect x="20" y="202" width="860" height="18" fill="#2c2c2c"/><text x="24" y="215">$FC62-$FC63</text><text x="150" y="215">$0C62</text><text x="205" y="215">P1 touch report: 1 + the enemy index when one is within 8 pixels on both axes</text><text x="655" y="215">MCU</text><text x="775" y="215">never</text>
    <rect x="20" y="222" width="860" height="18" fill="#5a3a3a"/><text x="24" y="235">$FC67-$FC6B</text><text x="150" y="235">$0C67</text><text x="205" y="235">the same for player 2</text><text x="655" y="235">main / MCU</text><text x="775" y="235">-</text>
    <rect x="20" y="242" width="860" height="18" fill="#2c2c2c"/><text x="24" y="255">$FC6F-$FC71</text><text x="150" y="255">$0C6F</text><text x="205" y="255">commands for the lives counters and the value; $FC71 = $0D: the credit cheat</text><text x="655" y="255">main (never)</text><text x="775" y="255">MCU</text>
    <rect x="20" y="262" width="860" height="18" fill="#2c2c2c"/><text x="24" y="275">$FC72-77, $FC80-81</text><text x="150" y="275">$0C72</text><text x="205" y="275">four sequences: [list number, next value] pairs; $FC76 doubles as the bubble speed</text><text x="655" y="275">MCU (main: $FC76)</text><text x="775" y="275">only $FC76, as a variable</text>
    <rect x="20" y="282" width="860" height="18" fill="#5a5a3a"/><text x="24" y="295">$FC78-$FC7B</text><text x="150" y="295">$0C78</text><text x="205" y="295">16-bit countdown, run flag, done flag: 600 frames, for the missile launchers</text><text x="655" y="295">main, MCU</text><text x="775" y="295">yes: enemy code</text>
    <rect x="20" y="302" width="860" height="18" fill="#3a5a3a"/><text x="24" y="315">$FC7C</text><text x="150" y="315">$0C7C</text><text x="205" y="315">a counter stepping 0..5 every frame: the EXTEND letter picker</text><text x="655" y="315">MCU</text><text x="775" y="315">yes: EXTEND bubbles</text>
    <rect x="20" y="322" width="860" height="18" fill="#2c2c2c"/><text x="24" y="335">$FC7D</text><text x="150" y="335">$0C7D</text><text x="205" y="335">1 if a coin switch was held at power-on</text><text x="655" y="335">MCU, at boot</text><text x="775" y="335">never</text>
    <rect x="20" y="342" width="860" height="18" fill="#2c2c2c"/><text x="24" y="355">$FC82-$FC83</text><text x="150" y="355">$0C82</text><text x="205" y="355">the MCU ROM's 16-bit checksum (0)</text><text x="655" y="355">MCU, at boot</text><text x="775" y="355">never</text>
    <rect x="20" y="362" width="860" height="18" fill="#3a5a3a"/><text x="24" y="375">$FC85</text><text x="150" y="375">$0C85</text><text x="205" y="375">$37 when the MCU has booted: the handshake</text><text x="655" y="375">MCU, at boot</text><text x="775" y="375">yes: boot and 5 checks</text>
    <rect x="20" y="382" width="860" height="18" fill="#2c2c2c"/><text x="24" y="395">$FC88/$FD88/$FE88</text><text x="150" y="395">$0C88</text><text x="205" y="395">destinations of the three table-copy services</text><text x="655" y="395">MCU on request</text><text x="775" y="395">never requested</text>
    <rect x="20" y="402" width="860" height="18" fill="#2c2c2c"/><text x="24" y="415">$FF88-$FF93</text><text x="150" y="415">$0F88</text><text x="205" y="415">table-copy requests: [go, index, list, destination] x 3</text><text x="655" y="415">main (never)</text><text x="775" y="415">MCU</text>
    <rect x="20" y="422" width="860" height="18" fill="#3a5a3a"/><text x="24" y="435">$FF94</text><text x="150" y="435">$0F94</text><text x="205" y="435">coin lockout command: 1 = lock, $FF = release</text><text x="655" y="435">main, every frame</text><text x="775" y="435">MCU</text>
    <rect x="20" y="442" width="860" height="18" fill="#2c2c2c"/><text x="24" y="455">$FF95</text><text x="150" y="455">$0F95</text><text x="205" y="455">$42 arms the counter tamper traps</text><text x="655" y="455">main (never)</text><text x="775" y="455">MCU</text>
    <rect x="20" y="462" width="860" height="18" fill="#2c2c2c"/><text x="24" y="475">$FF96</text><text x="150" y="475">$0F96</text><text x="205" y="475">$47 would skip the 2.6 ms delay at the end of every MCU frame</text><text x="655" y="475">main (never)</text><text x="775" y="475">MCU</text>
    <rect x="20" y="482" width="860" height="18" fill="#2c2c2c"/><text x="24" y="495">$FF97</text><text x="150" y="495">$0F97</text><text x="205" y="495">$4A restarts the MCU</text><text x="655" y="495">main (never)</text><text x="775" y="495">MCU</text>
    <rect x="20" y="502" width="860" height="18" fill="#3a5a3a"/><text x="24" y="515">$FF98</text><text x="150" y="515">$0F98</text><text x="205" y="515">$47 enables the interrupt pulse and the MCU's coin counting (written at boot)</text><text x="655" y="515">main, once</text><text x="775" y="515">MCU</text>
    <rect x="20" y="522" width="860" height="18" fill="#2c2c2c"/><text x="24" y="535">$FF99</text><text x="150" y="535">$0F99</text><text x="205" y="535">1 when the MCU has added a credit</text><text x="655" y="535">MCU</text><text x="775" y="535">never</text>
  </g>
  <text x="20" y="555" fill="#909090" font-size="10">green: traffic the game depends on; red: data the main CPU supplies; purple: the MCU's results; yellow: the countdown; grey: services this program never uses.</text>
</svg>
