<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" font-family="Helvetica,Arial,sans-serif" font-size="13">
<rect width="860" height="470" fill="#fbfaf7"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs>
<g stroke="#333" stroke-width="1.5">
<rect x="40" y="40" width="200" height="110" fill="#ffe9c9" rx="6"/>
<rect x="40" y="230" width="200" height="90" fill="#dfeeff" rx="6"/>
<rect x="330" y="230" width="200" height="90" fill="#e6f5df" rx="6"/>
<rect x="330" y="40" width="200" height="110" fill="#f4dfef" rx="6"/>
<rect x="620" y="40" width="200" height="110" fill="#eee" rx="6"/>
<rect x="620" y="230" width="200" height="90" fill="#eee" rx="6"/>
<rect x="40" y="370" width="780" height="60" fill="#fff5d6" rx="6"/>
</g>
<g font-weight="bold" font-size="15"><text x="140" y="62" text-anchor="middle">Main Z80 (6 MHz)</text><text x="140" y="252" text-anchor="middle">Sub Z80 (6 MHz)</text><text x="430" y="252" text-anchor="middle">Sound Z80 (3 MHz)</text><text x="430" y="62" text-anchor="middle">MCU 6801U4 (1 MHz)</text><text x="720" y="62" text-anchor="middle">Video</text><text x="720" y="252" text-anchor="middle">YM2203 + YM3526</text></g>
<g><text x="140" y="82" text-anchor="middle">32 KB fixed + 4 x 16 KB banked ROM</text><text x="140" y="100" text-anchor="middle">work RAM, video RAM, palette</text><text x="140" y="118" text-anchor="middle">the game program</text><text x="140" y="136" text-anchor="middle">interrupted by the MCU each frame</text>
<text x="140" y="272" text-anchor="middle">32 KB ROM, shares $E000-$F7FF</text><text x="140" y="290" text-anchor="middle">collision helper</text><text x="140" y="308" text-anchor="middle">interrupted by VBLANK</text>
<text x="430" y="272" text-anchor="middle">32 KB ROM, 4 KB RAM</text><text x="430" y="290" text-anchor="middle">music and effects sequencer</text><text x="430" y="308" text-anchor="middle">NMI from the command latch, IRQ from timers</text>
<text x="430" y="82" text-anchor="middle">4 KB ROM, 1 KB shared RAM window</text><text x="430" y="100" text-anchor="middle">joysticks, coins, DIP switches</text><text x="430" y="118" text-anchor="middle">enemy geometry, random lists</text><text x="430" y="136" text-anchor="middle">pulses the main CPU interrupt</text>
<text x="720" y="82" text-anchor="middle">8 x 64 KB tile ROMs (16,384 tiles)</text><text x="720" y="100" text-anchor="middle">object list of 64 tile columns</text><text x="720" y="118" text-anchor="middle">256 x 224 of a 384 x 264 raster</text><text x="720" y="136" text-anchor="middle">59.19 Hz, rotated monitor</text>
<text x="720" y="272" text-anchor="middle">3 FM + 3 SSG channels (YM2203)</text><text x="720" y="290" text-anchor="middle">9 FM channels (YM3526)</text><text x="720" y="308" text-anchor="middle">mixed to one mono output</text>
<text x="430" y="392" text-anchor="middle" font-weight="bold">Shared memories</text><text x="430" y="412" text-anchor="middle">$E000-$F7FF: main and sub Z80 (work RAM)     $FC00-$FFFF: main Z80 and MCU (1 KB)     $FA00 latch: main and sound Z80</text></g>
<g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M330,95 L240,95"/><path d="M140,150 L140,230"/><path d="M240,120 L330,280"/><path d="M240,60 L620,60"/><path d="M530,280 L620,280"/>
</g>
<g font-size="11" fill="#444"><text x="285" y="88" text-anchor="middle">INT each frame</text><text x="150" y="195">shared RAM, NMI</text><text x="285" y="215" text-anchor="middle">command latch, NMI</text><text x="430" y="52" text-anchor="middle">object RAM, tile columns</text><text x="575" y="272" text-anchor="middle">register writes</text></g>
</svg>
