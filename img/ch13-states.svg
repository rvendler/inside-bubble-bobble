<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="900" height="400" fill="#181818"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0c0c0"/></marker></defs>
  <text x="20" y="24" fill="#ffffff" font-size="13">The player's life cycle: the state byte at +$00, as player_life_cycle ($4011) walks it every frame</text>
  <g stroke="#c0c0c0" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <path d="M190,110 L270,110"/>
    <path d="M450,110 L530,110"/>
    <path d="M610,130 L610,190"/>
    <path d="M530,210 L450,210"/>
    <path d="M360,230 L360,290"/>
    <path d="M280,310 L190,310 L110,310 L110,130" stroke-dasharray="4,3"/>
    <path d="M440,310 L530,310"/>
    <path d="M700,110 L780,110"/>
    <path d="M840,130 L840,290 L780,290" stroke-dasharray="4,3"/>
  </g>
  <g fill="#e0e0e0" font-size="11" text-anchor="middle">
    <rect x="30" y="90" width="160" height="40" rx="6" fill="#3a3a5a" stroke="#8080c0"/><text x="110" y="108">0: waiting</text><text x="110" y="122">until round_start bit 7</text>
    <rect x="270" y="90" width="180" height="40" rx="6" fill="#3a5a3a" stroke="#80c080"/><text x="360" y="108">1: alive</text><text x="360" y="122">player_alive_update every frame</text>
    <rect x="530" y="90" width="170" height="40" rx="6" fill="#5a3a3a" stroke="#c08080"/><text x="615" y="108">$10: caught</text><text x="615" y="122">written by the sub CPU</text>
    <rect x="530" y="190" width="170" height="40" rx="6" fill="#5a3a3a" stroke="#c08080"/><text x="615" y="208">hit: rank - 1, death sprite</text><text x="615" y="222">from the facing, sound $0D</text>
    <rect x="270" y="190" width="180" height="40" rx="6" fill="#5a5a3a" stroke="#c0c080"/><text x="360" y="208">2: dying</text><text x="360" y="222">death_anim, 41 frames of a table</text>
    <rect x="280" y="290" width="160" height="40" rx="6" fill="#3a3a5a" stroke="#8080c0"/><text x="360" y="308">$80: dead; a life taken</text><text x="360" y="322">lives left: respawn</text>
    <rect x="530" y="290" width="180" height="40" rx="6" fill="#2c2c2c" stroke="#808080"/><text x="620" y="308">no lives: out of the game,</text><text x="620" y="322">rank - 3, TO CONTINUE</text>
    <rect x="780" y="90" width="110" height="40" rx="6" fill="#5a3a5a" stroke="#c080c0"/><text x="835" y="108">4: the bank-2</text><text x="835" y="122">special state</text>
  </g>
  <g fill="#a0a0a0" font-size="10">
    <text x="195" y="105">round starts</text>
    <text x="455" y="105">enemy, fire, rock,</text><text x="455" y="117">missile, boss (ch. 11)</text>
    <text x="470" y="205">state 2</text>
    <text x="365" y="265">animation done: EXTEND bonus</text><text x="365" y="277">if collected, score cleared</text>
    <text x="120" y="230">player_round_init: record cleared, slot at the corner,</text><text x="120" y="242">MCU told, 180 frames of invincibility if the clock runs</text>
    <text x="445" y="305">none left</text>
    <text x="705" y="105">item effects</text>
  </g>
  <text x="20" y="370" fill="#909090" font-size="10">The sub CPU never moves the state past $10; the main CPU's task 3 notices $10 on the next frame and starts the death. While dying and while</text>
  <text x="20" y="384" fill="#909090" font-size="10">invincible the player is not catchable (chapter 11), and the round's enemies keep moving: only the HURRY UP freeze stops them.</text>
</svg>
